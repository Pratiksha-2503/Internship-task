<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Card Replica</title>
    <style>
        :root {
            --card-yellow: #FBE243;
            --border-gold: #D5B152;
            --hp-red: #E21E26;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .card {
            width: 350px;
            height: 500px;
            background-color: var(--card-yellow);
            border: 14px solid var(--border-gold);
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 4px;
        }
        .stage { font-size: 9px; font-weight: bold; position: absolute; top: 12px; }
        .name { font-size: 26px; font-weight: bold; margin-top: 8px; letter-spacing: -1px; }
        .hp-group { display: flex; align-items: center; color: var(--hp-red); }
        .hp-amount { font-size: 20px; font-weight: bold; margin-right: 4px; }
        .energy-type { 
            background: #FF0; width: 20px; height: 20px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; border: 1px solid #000; color: black;
        }

    
        .image-box {
            width: 100%;
            height: 180px;
            border: 4px solid var(--border-gold);
            background: #36b7ea; 
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(8, 3, 3, 0.2);
            margin-bottom: 2px;
        }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }

        
        .flavor-bar {
            background: linear-gradient(90deg, #D5B152, #FBE243, #D5B152);
            font-size: 10px;
            font-style: italic;
            text-align: center;
            font-weight: bold;
            padding: 2px;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

       
        .move {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .cost { width: 45px; display: flex; gap: 2px; }
        .energy-cost { 
            width: 16px; height: 16px; border-radius: 50%; border: 1px solid #444;
            background: #ccc; /* Colorless default */
        }
        .energy-cost.lightning { background: #FF0; }
        
        .move-description { flex: 1; padding: 0 8px; }
        .move-name { font-size: 18px; font-weight: bold; }
        .move-text { font-size: 10px; line-height: 1.1; }
        .damage { font-size: 20px; font-weight: bold; }

       
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            font-size: 8px;
            text-transform: uppercase;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        .description-box {
            border: 1px solid #000;
            margin-top: 8px;
            padding: 4px;
            font-size: 10px;
            font-style: italic;
            line-height: 1.2;
        }

       
        .stamp {
            position: absolute;
            right: 25px;
            bottom: 160px;
            width: 40px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="stage">Basic Pokémon</div>
    <div class="header">
        <div class="name"><b>Pikachu</b></div>
        <div class="hp-group">
            <span class="hp-amount">40 HP</span>
            <div class="energy-type">⚡</div>
        </div>
    </div>

    <div class="image-box">
        <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png" alt="Pikachu">
    </div>

    <div class="flavor-bar"><b>
        Mouse Pokémon. Length: 1' 4", Weight: 13 lbs.
        </b>
    </div>

    <div class="move">
        <div class="cost"><div class="energy-cost"></div></div>
        <div class="move-description">
            <span class="move-name">Gnaw</span>
        </div>
        <div class="damage">10</div>
    </div>

    <div class="move">
        <div class="cost">
            <div class="energy-cost lightning"></div>
            <div class="energy-cost"></div>
        </div>
        <div class="move-description">
            <span class="move-name">Thunder Jolt</span>
            <div class="move-text">Flip a coin. If tails, Pikachu does 10 damage to itself.</div>
        </div>
        <div class="damage">30</div>
    </div>

    <div class="stats">
        <div>weakness<br>🥊</div>
        <div>resistance</div>
        <div>retreat cost<br>⚪</div>
    </div>

    <div class="description-box">
        When several of these Pokémon gather, their electricity can cause lightning storms. LV. 12 #25
    </div>
</div>

</body>
</html>
