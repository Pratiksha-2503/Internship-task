<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sign up form</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #f6d365, #fda085);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    background: #fff;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 450px;
  }
  h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #ff6b81;
    font-size: 28px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    color: #555;
    font-weight: 500;
    font-size: 14px;
  }
  input,
  select,
  textarea {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #ffe0b2;
    border-radius: 12px;
    font-size: 15px;
    transition: all 0.3s ease;
    box-sizing: border-box;
  }
  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: #ff6b81;
    box-shadow: 0 0 8px rgba(255, 107, 129, 0.4);
  }
  textarea {
    resize: none;
  }
  .terms {
    display: flex;
    align-items: center;
    font-size: 14px;
    margin-bottom: 20px;
    gap: 10px;
  }
  .terms input[type='checkbox'] {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  .terms label {
    margin: 0;
    cursor: pointer;
    user-select: none;
    color: #333;
  }
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #ff6b81, #fda085);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  button:hover {
    background: linear-gradient(135deg, #fda085, #ff6b81);
    transform: translateY(-2px);
  }
  .msg {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    color: #ff3b57;
  }
  @media (max-width: 500px) {
    .container {
      padding: 30px 20px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <h2>Sign Up</h2>

    <form id="regForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder=" Your full Name" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="example@email.com" />
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Your username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
        />
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Your age" min="1" max="120" />
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender">
          <option value="">Select gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="123-456-7890" />
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" rows="2" placeholder="Your address"></textarea>
      </div>
      <div class="terms">
        <input type="checkbox" id="terms" />
        <label for="terms">I agree to the Terms & Conditions</label>
      </div>

      <button type="submit">Register</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', function (e) {
      e.preventDefault();

      let name = document.getElementById('fullName').value.trim();
      let email = document.getElementById('email').value.trim();
      let user = document.getElementById('username').value.trim();
      let pass = document.getElementById('password').value;
      let confirm = document.getElementById('confirmPassword').value;
      let age = document.getElementById('age').value;
      let gender = document.getElementById('gender').value;
      let phone = document.getElementById('phone').value.trim();
      let address = document.getElementById('address').value.trim();
      let terms = document.getElementById('terms').checked;

      if (
        !name ||
        !email ||
        !user ||
        !pass ||
        !confirm ||
        !age ||
        !gender ||
        !phone ||
        !address
      ) {
        document.getElementById('msg').innerHTML = '❌ Please fill in all fields';
        return;
      }

      if (pass.length < 6) {
        document.getElementById('msg').innerHTML =
          '❌ Password must be at least 6 characters';
        return;
      }

      if (pass !== confirm) {
        document.getElementById('msg').innerHTML = '❌ Passwords do not match';
        return;
      }

      if (!terms) {
        document.getElementById('msg').innerHTML =
          '❌ You must agree to Terms & Conditions';
        return;
      }

      document.getElementById('msg').innerHTML =
        '✅ Registration Successful! Welcome, ' + user;
      document.getElementById('regForm').reset();
    });
  </script>
</body>
</html>
